[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomai-review"
version = "0.1.0"
description = "Bounded, reproducible Xiaomai engineering review examples"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
lifecycle = ["torch==2.14.0", "numpy==2.5.3", "transformers==5.12.1", "numba==0.67.0", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
